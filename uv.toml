[pip]

# FlagEmbedding declares ir-datasets, but this project does not use that path and
# ir-datasets pulls warc3-wet-clueweb09, whose sdist no longer builds cleanly.
[[pip.dependency-metadata]]
name = "FlagEmbedding"
version = "1.3.5"
requires-dist = [
    "torch>=1.6.0",
    "transformers>=4.44.2",
    "datasets>=2.19.0",
    "accelerate>=0.20.1",
    "sentence-transformers",
    "peft",
    "sentencepiece",
    "protobuf",
    "deepspeed; extra == 'finetune'",
    "flash-attn; extra == 'finetune'",
]
provides-extra = ["finetune"]
