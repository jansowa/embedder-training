backend: sentence-transformers
training_type: splade

# Mixture arm: the 2073 filtered FiQA rows plus the 2073 synthetic PolQA rows of
# arm_wikisynth_2073.yaml, shuffled. FiQA rows are already reranker-filtered
# (cache), so no dataset_filter is applied to the file.
runs_dir: runs/arm-fiqa-plus-wikisynth
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-plus-wikisynth.jsonl

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 256
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 4
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 32
  negatives_per_query: 6
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005
  splade_activation_stats:
    enabled: false
    sample_size: 128
    batch_size: 16
    interval_steps: 500
    quantization_factor: 100
    include_negatives: true

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
