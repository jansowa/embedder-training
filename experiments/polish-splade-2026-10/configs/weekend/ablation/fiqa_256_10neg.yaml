backend: sentence-transformers
training_type: splade

# Ablation of the cluster-like recipe (26.10 evening): the other half of the
# pair with fiqa_512_6neg.yaml. Keeps the 10 negatives and goes back to the
# 256-token context of ck-warmup-s; everything else identical to
# configs/weekend/cluster_like_fiqa_3060.yaml (2 x 16 batch, pooling chunk 8).
# Benchmarked at 512 like every other checkpoint, so the numbers compare.
runs_dir: runs/arm-fiqa-256-10neg
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-2073.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 256
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
