backend: sentence-transformers
training_type: splade

# 5070 Ti night, arm N6 (exploratory): distillation instead of contrastive loss.
# SparseMarginMSELoss regresses the SPLADE score margin (pos - neg) onto the
# reranker margin from the pos_scores / neg_scores fields (same reranker for
# FiQA and SQuAD, logits roughly -5..10). This is the SPLADE++ training signal
# (EnsembleDistil) that polish-splade itself was built with; never tried in
# this project. Same data and recipe as N1 otherwise. Last in the queue: a
# label-shape or scale problem here costs nothing else.
runs_dir: runs/arm-n6-mmse-fiqa-plus-squadv2
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-plus-squadv2.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_margin_mse

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 8
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 16
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
