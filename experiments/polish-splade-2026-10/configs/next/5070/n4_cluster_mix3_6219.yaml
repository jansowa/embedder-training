backend: sentence-transformers
training_type: splade

# 5070 Ti night, arm N4: source diversity — FiQA 2073 + SQuAD-v2 2073 +
# judged-clean MS MARCO 2073 (6219 rows, scripts/build_5070_arms.py), cluster-like
# recipe. MS MARCO alone was weakly positive on the 3060 (+0.35 tiny, +0.8
# held-out); here it is one third of a mix, as a soup ingredient candidate.
runs_dir: runs/arm-n4-cluster-mix3-6219
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/mix3-6219.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 8
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 16
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
