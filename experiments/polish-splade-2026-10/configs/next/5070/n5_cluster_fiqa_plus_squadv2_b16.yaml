backend: sentence-transformers
training_type: splade

# 5070 Ti night, arm N5: N1 with twice the physical batch (16 x 2 instead of
# 8 x 4, same effective 32). With no_duplicates sampling every passage in the
# physical batch is an in-batch negative, so this doubles the in-batch negatives
# per query (16 x 11 = 176 passages per step). Pooling chunk halved to keep the
# vocab-size logits within 16 GB; if this OOMs, nothing else in the night depends on it.
runs_dir: runs/arm-n5-cluster-fiqa-plus-squadv2-b16
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-plus-squadv2.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 16
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
