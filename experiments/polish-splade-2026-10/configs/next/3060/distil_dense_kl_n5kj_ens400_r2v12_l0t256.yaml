backend: sentence-transformers
training_type: splade

# r2v12 recipe (round 2 from soup-v12, two-way ensemble teacher, n5 + kj rows) with FLOPS under an L0 threshold (arXiv 2504.14839): only documents with more than 256 non-zero dimensions enter the document FLOPS term; weights unchanged. Compared with r2v12 (64.20 / 43.15, trec-covid 67.02, 404 dims/doc): nDCG against dims/doc.
runs_dir: runs/arm-dense-kl-n5kj-ens400-r2v12-l0t256
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/n5-plus-kj-tens400.jsonl

architectures:
  - models/soup-v12

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005
  document_regularizer_threshold: 256

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
