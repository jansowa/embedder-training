backend: sentence-transformers
training_type: splade

# The factual arm (queue v61): the rows of the dose arm of v56 (datasets/arms/n5-plus-kj-mined-dose3.jsonl, unchanged) plus 17402 rows of translated factual sets (NQ without popular culture, HotpotQA questions one passage answers, FEVER, TriviaQA; one positive per query, no reranker gate, PIRB queries removed), negatives mined by r2v12 from a pool of each source's own passages (5 best + 5 random of its top-60, length window 0.5-2.0), scored by the ensemble teacher (soup-v9b + PolDense-400M) with the fixed dense scale 84.19441654567078. The recipe of the mined arm from soup-v12, only the row file differs.
runs_dir: runs/arm-dense-kl-n5kj-mined-dose3-fact20-ens400-r2v12
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/n5-plus-kj-mined-dose3-fact20.jsonl

architectures:
  - models/soup-v12

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
