backend: sentence-transformers
training_type: splade

# Queue b1c, version R-c', the dose3 round: from the end of stage 1 (models/arm-b1-rc-s1p4, 200 000 MS MARCO-pl rows) on the rows and with the
# recipe of R-a / dose3 unchanged (b1_ra_dose3.yaml). The queue derives a _gc copy when the recipe does not fit the 8 GB card.
runs_dir: runs/arm-b1-rc-d3
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/n5-plus-kj-mined-dose3.jsonl

architectures:
  - models/arm-b1-rc-s1p4

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
