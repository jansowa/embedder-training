backend: sentence-transformers
training_type: splade

# SPLADE-to-SPLADE distillation (queue v35): teacher soup-v9b, student sdadas/polish-splade. Fresh rows instead of a
# second epoch: the n5 rows (fiqa-2073 + 16000 gated SQuAD-v2, better translation, 18 073 rows) plus msmarco-clean-20000,
# ONE epoch (~38 k examples), i.e. the same number of optimizer steps as arm-distil-v9b-kl-n5v2 (18 k rows x 2 epochs,
# 63.39 / 42.80) with every example seen once. Does distillation keep paying with fresh data at equal compute?
# Loss sparse_distill_kl_div, FLOPS kept, 512 tokens, 10 negatives, 2 x 16, gate filter (the teacher script keeps the
# gate scores in pos_scores_stronger_reranker).
runs_dir: runs/arm-distil-v9b-kl-n6-fresh38k
timestamp_output_dir: true
save_resolved_config: true

train_data:
  - path: datasets/arms/fiqa-plus-squadv2v2-18k-tv9b.jsonl
  - path: datasets/arms/msmarco-clean-20000-tv9b.jsonl
dataset_mix_strategy: concat_shuffle
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 1
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
