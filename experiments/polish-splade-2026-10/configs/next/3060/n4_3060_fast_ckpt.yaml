backend: sentence-transformers
training_type: splade

# Speed control fallback (queue v34-speed): n4_3060_fast.yaml with gradient checkpointing kept, used only when the
# worst-case memory check (scripts/splade_head_memcheck.py) says the no-checkpointing variant does not fit the 8 GB card.
# Micro-benchmark: 1.85x. Recipe and rows of arm-n4-3060 otherwise.
runs_dir: runs/arm-n4-3060-fast
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/mix3-6219.jsonl
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  splade_fused_head: exact
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
