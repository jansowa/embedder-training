backend: sentence-transformers
training_type: splade

# Dense-teacher distillation probe (queue v38, 5.11): KL from the ensemble teacher: mean of soup-v9b's dot products and PolDense-150M's scaled cosines per pair (SPLADE-v3 style ensemble; the SPLADE half anchors the student in its own geometry). Same rows (n1, 4 146 rows), recipe and seed as arm-distil-v9b-kl-n1v2 (63.25 / 42.62, teacher soup-v9b) and the MNRL control n1-5070 (62.98 / 42.17). Sparse-gradient head without checkpointing.
runs_dir: runs/arm-dense-kl-n1v2-ens
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-plus-squadv2v2-tens.jsonl
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
