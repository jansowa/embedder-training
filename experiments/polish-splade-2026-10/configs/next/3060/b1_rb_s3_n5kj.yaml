backend: sentence-transformers
training_type: splade

# Queue b1, version R-b, first stage: from the KD model of the larger backbone (models/kd-rbase-v2-dqf-full) on the n5 + kj rows with the
# recipe of r2v12 (distil_dense_kl_n5kj_ens400_r2v12.yaml), as stage 3 of the ALBERT lineage. Followed by b1_rb_r2_dose3.yaml.
runs_dir: runs/arm-b1-rb-s3
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/n5-plus-kj-tens400.jsonl

architectures:
  - models/kd-rbase-v2-dqf-full

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
