backend: sentence-transformers
training_type: splade

# Distillation arm (plan of 27.10, step B): the fiqa-2073 queries re-scored by
# sdadas/polish-reranker-roberta-v3 (positives and all 10 negatives) in the
# hardnegatives project, trained with margin-MSE on the teacher margins.
# No dataset_filter: the rows are the already-gated 2073 queries and the v3
# logits are on a different scale than the 23.50 gate.
# score_normalization: per_query_minmax
runs_dir: runs/arm-mmse-fiqa-v3-minmax
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-2073-v3.jsonl

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_margin_mse

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: per_query_minmax
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
