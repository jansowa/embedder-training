backend: sentence-transformers
training_type: splade

# Ensemble-teacher distillation (queue v39, 6.11): KL from the mean of soup-v9b dot products and PolDense-400M cosines scaled to soup-v9b's units (kitchen bridge/dense_teacher_scores.py, reference -tv9b; v38b: on the n1 rows the ensemble kept heldout8 where dense alone lost it). Same rows, recipe and seed as arm-distil-v9b-kl-n4v2 (63.27 / 42.63); fast head, no checkpointing.
runs_dir: runs/arm-dense-kl-n4v2-ens400
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/mix3v2-6219-tens400.jsonl
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
