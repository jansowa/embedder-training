backend: sentence-transformers
training_type: splade

# Data probe S2 (PLAN-5070-MLM-2026-11-03.md §4, queue v31, 3060): which source teaches fastest from the
# MLM? Exactly the settings of mlm-path-ep3 (polish-distilroberta, lr 5e-5 linear, 4 x 8, 256 tokens,
# 6 negatives, docreg 0.001) and the same 1 875 steps = 60 k examples, only the data differs:
# (a) msmarco judged clean + plain (38 k rows). Compare with mlm-path-ep3 (msmarco-clean-20000 x 3 epochs) in the quantized regime.
runs_dir: runs/arm-mlm-s2a-msmarco
timestamp_output_dir: true
save_resolved_config: true

train_data:
  - path: datasets/judged/msmarco-clean-20000.jsonl
  - path: datasets/judged/msmarco-plain-20000.jsonl
dataset_mix_strategy: concat_shuffle
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-distilroberta

hparams:
  - learning_rate: 5e-5
    num_train_epochs: 3
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 256
  max_steps: 1875
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 4
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 32
  negatives_per_query: 6
  save_strategy: "no"
  keep_epoch_checkpoints: false
  logging_steps: 25
  splade_activation_stats:
    interval_steps: 250
    sample_size: 128
    batch_size: 16
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
