backend: sentence-transformers
training_type: splade

# Ensemble-teacher distillation on the colleague's rows (datasets/karoljez/train, strict_fast_v1: 2 219 audited rows, 64 % legal, 1 positive + 10 graded negatives, 6.11): KL from the mean of soup-v9b dot products and PolDense-400M cosines scaled to soup-v9b's units. Same recipe and seed as arm-dense-kl-n1v2-ens400 (4 146 rows: 63.43 / 42.58); no dataset filter: the 23.5 gate is a gemma score on English pairs, which these rows do not have. Fast head, no checkpointing.
runs_dir: runs/arm-dense-kl-kj-ens400
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/karoljez-2219-tens400.jsonl

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
