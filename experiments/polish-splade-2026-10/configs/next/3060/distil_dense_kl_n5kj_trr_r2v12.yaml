backend: sentence-transformers
training_type: splade

# Round 2 from soup-v12 on n5 + kj with the cross-encoder alone as the teacher (sdadas/polish-reranker-roberta-v3, logits scaled to soup-v9b units). The classic SPLADE recipe (cross-encoder margins); compared with the three-way ensemble and r2v12.
runs_dir: runs/arm-dense-kl-n5kj-trr-r2v12
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/n5-plus-kj-trr.jsonl

architectures:
  - models/soup-v12

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
