backend: sentence-transformers
training_type: splade

# n4 pattern with nq as the third component: fiqa-2073 + squadv2-2073 + nq-2073; fallback: CachedSpladeLoss at batch 32 (mini-batch 2).
# Generated by scripts/build_v23_configs.py.
runs_dir: runs/arm-n4x-nq
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-squadv2-nq-6219.jsonl
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 32
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  cached_loss: true
  mini_batch_size: 2
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
