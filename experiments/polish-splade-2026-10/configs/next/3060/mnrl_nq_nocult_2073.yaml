backend: sentence-transformers
training_type: splade

# Single-set screen (queue v26): nq without culture_entertainment and sport (LLM domain of the positive), one relevance-3 positive per row, no row with an LLM false negative; kitchen recipe cut/recipes/nq-nocult-rel3-2073.yaml on nq-pool-8000. Predecessor arm-mnrl-nq-2073: 60.37 tiny. Recipe mnrl (cluster-like), 512 tokens, 10 negatives, batch 2 x 16, pooling chunk 8, gate filter.
runs_dir: runs/arm-mnrl-nq-nocult-2073
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/nq-nocult-rel3-2073.jsonl
dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
