backend: sentence-transformers
training_type: splade

# SPLADE-to-SPLADE distillation sanity test (3060, queue v32; plan docs/PLAN-5070-MLM-2026-11-03.md §11.1):
# teacher soup-v9b (63.65 / 42.56), student sdadas/polish-splade, rows of n1 (fiqa-plus-squadv2, 4 146), teacher dot
# products in pos_scores / neg_scores (kitchen bridge/splade_teacher_scores.py, suffix -tv9b). Recipe of
# the 3060 arms (512 tokens, 10 negatives, lr 2e-5, 2 epochs, 2 x 16), loss sparse_distill_kl_div, FLOPS as always,
# no score_scale (same units). Control: arm-n4-3060 62.89 / 42.01 (n4 rows, MNRL), n1-5070 62.98 / 42.17.
runs_dir: runs/arm-distil-v9b-kl-n1
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-plus-squadv2-tv9b.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
