backend: sentence-transformers
training_type: splade

# The mined arm with a query prefix (queue v54): every query starts with "zapytanie: " in training (documents without a prefix); evaluation must use the same prefix. Otherwise the mined arm: negatives mined once by r2v12 from the rows' own passages, ensemble teacher (soup-v9b + PolDense-400M), the r2v12 recipe from soup-v12.
runs_dir: runs/arm-dense-kl-n5kj-mined-qp-ens400-r2v12
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/n5-plus-kj-mined-tens400.jsonl

architectures:
  - models/soup-v12

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_distill_kl_div

sentence_transformers:
  query_prefix: "zapytanie: "
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  splade_fused_head: exact
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  kl_temperature: 2.0
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
