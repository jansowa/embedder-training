backend: sentence-transformers
training_type: splade
runs_dir: runs/polish-splade-dataset-small-lr2e-6
timestamp_output_dir: true
train_data: dataset-b001f0005-r100-no_in_batch_neg

architectures:
  - sdadas/polish-distilroberta
#  - sdadas/polish-roberta-base-v2
  # This checkpoint is published as BertModel/feature-extraction, so SPLADE can
  # construct a MaskedLM head, but the head may not load pretrained weights.
#  - allegro/herbert-base-cased

hparams:
  - learning_rate: 2e-6
    num_train_epochs: 3
    document_regularizer_weight: 0.001
    loss: sparse_margin_mse


sentence_transformers:
  train_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 32
  negatives_per_query: 10
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  report_to:
    - wandb
  # document_regularizer_weight: 0.00003
  query_regularizer_weight: 0.00005
  # score_normalization: none
  # score_normalization: per_query_minmax
  # score_normalization: per_query_zscore
  splade_activation_stats:
    enabled: true
    sample_size: 128
    batch_size: 16
    interval_steps: 500
    quantization_factor: 100
    include_negatives: true
