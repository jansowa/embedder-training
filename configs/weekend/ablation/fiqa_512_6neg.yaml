backend: sentence-transformers
training_type: splade

# Ablation of the cluster-like recipe (26.10 evening): arm-cluster-like-fiqa
# (512 tokens, 10 negatives) scored 62.27 on tiny vs 61.49 for ck-warmup-s on
# the same FiQA 2073 rows at 256 / 6. This arm keeps the 512-token context and
# goes back to 6 negatives: everything else (2 x 16 batch, pooling chunk 8,
# lr, epochs) is identical to configs/weekend/cluster_like_fiqa_3060.yaml.
runs_dir: runs/arm-fiqa-512-6neg
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-2073.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 6
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
