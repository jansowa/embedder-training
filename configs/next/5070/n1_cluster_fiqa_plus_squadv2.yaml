backend: sentence-transformers
training_type: splade

# 5070 Ti night, arm N1: the best 3060 data mix (FiQA 2073 + SQuAD-v2 2073, 4146
# rows) with the cluster-like recipe: 512 tokens, 10 hard negatives per query,
# effective batch 32 (8 x 4). Reference on the 3060 at 256 / 6 negatives:
# models/arm-fiqa-plus-squadv2 = 61.84 tiny, 40.43 held-out.
runs_dir: runs/arm-n1-cluster-fiqa-plus-squadv2
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-plus-squadv2.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 8
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 16
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
