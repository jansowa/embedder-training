backend: sentence-transformers
training_type: splade

# GradCache speed probe: the cluster-like recipe at a true batch of 32 queries, mini-batch 4,
# gradient checkpointing on, three optimizer steps, no logging.
# Generated by scripts/build_v24_configs.py.
runs_dir: runs/smoke-cb32-mb4-gc
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-2073.jsonl

dataset_filter: configs/dataset_filters/splade_positive_score_gt_23_50_no_metricx.yaml
dataset_filter_cache_dir: cache/filtered_datasets

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 1
    max_steps: 3
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 32
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  cached_loss: true
  mini_batch_size: 4
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to: []
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
