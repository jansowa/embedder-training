backend: sentence-transformers
training_type: splade

# Student-mined negatives: 2 student (splade-own) + 8 old v3 negatives per query; recipe mnrl, batch 2 x 16, pooling chunk 2.
# Generated by scripts/build_splade_neg_configs.py.
runs_dir: runs/arm-mnrl-fiqa-splade-mix2-c2
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-2073-splade-mix2.jsonl

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_multiple_negatives_ranking

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 2
  negatives_per_query: 10
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
