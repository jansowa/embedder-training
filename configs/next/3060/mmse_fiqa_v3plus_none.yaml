backend: sentence-transformers
training_type: splade

# Step C: the same 2073 queries with the extra synthetic positives of the MINE_POSITIVES export.
# Generated by scripts/build_mmse_v3_configs.py; recipe of mmse_fiqa_v3_none.yaml otherwise.
# score_normalization: none
runs_dir: runs/arm-mmse-fiqa-v3plus-none
timestamp_output_dir: true
save_resolved_config: true

train_data: datasets/arms/fiqa-2073-v3-plus.jsonl

architectures:
  - sdadas/polish-splade

hparams:
  - learning_rate: 2e-5
    num_train_epochs: 2
    document_regularizer_weight: 0.001
    loss: sparse_margin_mse

sentence_transformers:
  max_seq_length: 512
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  train_batch_size: 2
  batch_sampler: no_duplicates
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  fp16: true
  splade_pooling_chunk_size: 8
  negatives_per_query: 10
  score_normalization: none
  save_strategy: "no"
  keep_epoch_checkpoints: false
  report_to:
    - wandb
  query_regularizer_weight: 0.00005

benchmark:
  run_pirb: false
  scope: tiny
  max_seq_length: 512
  query_instruction: ""
  checkpoints:
    - final
